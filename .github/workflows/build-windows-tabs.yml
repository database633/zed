name: Build Zed (project tabs) for Windows

# Builds a Windows Inno Setup installer (target/Zed-x86_64.exe) with the
# browser-style project tabs, on a GitHub-hosted windows-2022 runner.
#
# When localize=zh-CN (the default for branch pushes) the zed-i18n toolchain
# is cloned, the manifest is re-extracted against this fork, and the
# Simplified Chinese translations are applied before bundling.
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Target architecture"
        required: false
        default: x86_64
        type: choice
        options:
          - x86_64
          - aarch64
      localize:
        description: "UI localization applied before bundling"
        required: false
        default: zh-CN
        type: choice
        options:
          - zh-CN
          - none
  push:
    branches:
      - project-tabs

concurrency:
  group: build-windows-tabs-${{ github.ref }}-${{ inputs.architecture }}-${{ inputs.localize }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  ZED_I18N_REPO: https://github.com/LI-NA/zed-i18n
  ZED_VERSION: v1.27.0
  # Branch pushes default to the Simplified Chinese build; a manual run can
  # pick "none" to build the plain English UI.
  LOCALIZE: ${{ inputs.localize || 'zh-CN' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain from rust-toolchain.toml
        shell: pwsh
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Report initial disk space
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Install uv
        if: env.LOCALIZE == 'zh-CN'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Clone zed-i18n, point it at this fork, regenerate the string manifest
      # against our modified sources, then apply the Chinese translations into
      # the fetched checkout. Occurrence line numbers shift because of our
      # edits, so the re-extract is required before `apply`.
      - name: Apply Simplified Chinese UI (zed-i18n)
        if: env.LOCALIZE == 'zh-CN'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 $env:ZED_I18N_REPO i18n

          $config = @(
            'zed_version = "' + $env:ZED_VERSION + '"',
            'zed_repository = "${{ github.server_url }}/${{ github.repository }}"',
            'zed_ref = "${{ github.ref_name }}"',
            'cache_dir = ".cache/zed"'
          )
          Set-Content -Path i18n/config/project.toml -Value $config -Encoding utf8

          Push-Location i18n
          uv python install 3.12
          uv sync
          uv run zed-i18n fetch-zed
          # The clean-extract checkout is unused here; drop it to save disk.
          if (Test-Path .cache/zed/$env:ZED_VERSION-clean-extract) {
            Remove-Item -Recurse -Force .cache/zed/$env:ZED_VERSION-clean-extract
          }
          uv run zed-i18n extract --zed-root .cache/zed/$env:ZED_VERSION
          uv run zed-i18n apply --language zh-CN
          Pop-Location

      - name: Select build directory
        shell: pwsh
        run: |
          if ($env:LOCALIZE -eq 'zh-CN') {
            "BUILD_DIR=${{ github.workspace }}\i18n\.cache\zed\$env:ZED_VERSION" >> $env:GITHUB_ENV
          } else {
            "BUILD_DIR=${{ github.workspace }}" >> $env:GITHUB_ENV
          }

      # Zed's bundle script hardcodes the Community edition of VS. GitHub's
      # windows-2022 image ships Enterprise/BuildTools at a different path, so
      # point it at whichever edition actually exists on this runner.
      - name: Point bundle-windows.ps1 at the runner's Visual Studio edition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:BUILD_DIR
          $path = 'script/bundle-windows.ps1'
          $default = 'C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\Launch-VsDevShell.ps1'
          if (Test-Path $default) {
            Write-Host "Community edition present; no patch needed."
            exit 0
          }
          foreach ($edition in @('Enterprise', 'Professional', 'BuildTools')) {
            $candidate = "C:\Program Files\Microsoft Visual Studio\2022\$edition\Common7\Tools\Launch-VsDevShell.ps1"
            if (Test-Path $candidate) {
              $script = Get-Content $path -Raw
              $script = $script.Replace($default, $candidate)
              Set-Content -Path $path -Value $script -NoNewline
              Write-Host "Patched VS developer shell -> $candidate"
              exit 0
            }
          }
          Write-Error "No Visual Studio 2022 developer shell found on this runner"

      - name: Build installer
        shell: pwsh
        run: |
          Set-Location $env:BUILD_DIR
          # Empty CI hides the release-only env checks and Sentry upload; we
          # build an unsigned installer.
          $env:CI = ''
          ./script/bundle-windows.ps1 -Architecture ${{ inputs.architecture || 'x86_64' }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Zed-windows-${{ inputs.architecture || 'x86_64' }}-${{ env.LOCALIZE }}-installer
          path: ${{ env.BUILD_DIR }}/target/Zed-${{ inputs.architecture || 'x86_64' }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Report final disk space
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
